dance on using the Risk Filter Suite in relation to SBTN, TNFD and ESRS.",name:"WWF Water Risk Filter",types:["Risk assessment"],map:!0,mapUrl:"https://riskfilter.org/water/explore/map",website:"https://riskfilter.org",desc:"Enables companies and financial institutions to assess their water-related risks: physical (scarcity, pollution, flooding), regulatory, and reputational risks based on geographic and sector-specific data.",riskScope:"Water Risk,Drought Risk,Flood Risk,Ecosystem services status Risk",scenariosText:"Current hazards.",lastVersion:"April 2026",historisation:"V3.0. The first version was launched in 2012. Previous V1 and V2 methodologies remain available.",frequency:"About every two years.",locationScope:"World",coverage:"Global with local granularity. 25 industries covered. All asset categories directly linked to companies (private/publicly traded equities, corporate bonds, real estate, tangible assets).",indicators:"~60 indicators, 17 risks categories, 3 risks types",dataS:`Sources
Aggregates data from 30\u201340 international sources including WWF (internal analyses), WRI (Aqueduct), FAO (AQUASTAT), NASA/satellite data, IUCN, UNEP, World Bank, IPCC, HydroSHEDS, and peer-reviewed scientific databases.

Scoring & Methodology
After standardising and transforming raw data into 60+ indicators (scored 1\u20135), basin risk categories (17) are calculated based on fixed weights. Risk categories are aggregated into 3 risk types (physical, regulatory deficiency & reputational) using weighted averages. A country risk score is also calculated. Users must input: site location, WWF RFS Industry Sector Classification, and site importance (high/medium/low).`,extraction:"In the Assess module, download risk values for all sites in Excel via the Portfolio Manager. Average risk values at country and province level available in the Country Profiles page of the Explore module (no registration required).",extractionLink:"https://riskfilter.org",typeOfId:"ISO Country code, Sub-country ID, Site ID",exhOrg:"https://weefin.zendesk.com/hc/en-gb/articles/50551642020625-WWF",exhDataset:"https://weefin.zendesk.com/hc/en-gb/articles/50551816631825-WWF-Water-Risk-Filter"},{cat:"Physical Risk",org:"World Resources Institute",orgType:"Independent research organisation headquartered in the US. More than 2,000 employees working with partners in over 50 countries. Offices in Beijing, India, Europe, Brazil, Indonesia, Mexico and Africa.",created:"June 1982, Washington D.C.",objectives:"Leveraging data, expertise and global reach to influence policies and catalyse changes in food, land, water, energy and cities. Producing open datasets, applications and data infrastructure. Harnessing advances in data and technology through the WRI Data Lab.",partners:"The Aqueduct Alliance and research partners including Delft University of Technology, Deltares, Utrecht University, IVM and RepRisk. AgriAdapt acknowledges contributors: Clima y Cafe, National Agro Foundation, Tamil Nadu Agricultural University, and a Technical Advisory Committee including CIAT, FAO GAEZ, IFPRI, IIASA, Olam, Suntory, World Bank and World Cocoa Foundation.",name:"Aqueduct Water Risk Atlas",types:["Risk assessment"],map:!0,mapUrl:"https://www.wri.org/aqueduct",website:"https://www.wri.org/aqueduct",desc:"Data platform enabling businesses, governments and civil society to understand and respond to water-related risks: water stress, seasonal variability, pollution and access to water. Thirteen water risk indicators covering quantity, quality and reputational aspects.",riskScope:"Water Risk",scenariosText:"Business-as-usual SSP3/RCP7.0; Optimistic SSP1/RCP2.6; Pessimistic SSP5/RCP8.5",lastVersion:"August 2023",historisation:"First version in 2013. Two other versions between 2013 and 2019. Latest version in 2023.",frequency:"Every other year (not regular).",locationScope:"World",coverage:"Global, based on HydroBASINS 6 sub-basins and the PCR-GLOBWB 2 hydrological model covering all countries and regions worldwide.",indicators:"13 (3 pillars)",dataS:`Sources
Each indicator comes from an open-source, peer-reviewed data provider.

Scoring & Methodology
Overall water risk with 3 pillars and 13 indicators (physical risk quantity (8), physical risk quality (2) and regulatory/reputational risk (3)). Each indicator is converted into a normalised risk score (0\u20135). Normalised indicator scores are aggregated by category using sector-specific weighting schemes. WRI aggregates catchment-level data to country and provincial levels using gross water demand weighting.`,extraction:"Downloading directly in CSV via the link.",extractionLink:"https://www.wri.org/aqueduct",typeOfId:"ISO country code, UN regions' name, World Bank regions' name, GADM",exhOrg:"https://weefin.zendesk.com/hc/en-gb/articles/50552597803793-World-Resources-Institute",exhDataset:"https://weefin.zendesk.com/hc/en-gb/articles/50552475923345-Aqueduct-Water-Stress-Index"},{cat:"Physical Risk",org:"World Resources Institute",orgType:"Independent research organisation headquartered in the US. More than 2,000 employees working with partners in over 50 countries.",created:"June 1982, Washington D.C.",objectives:"Leveraging data, expertise and global reach to influence policies and catalyse changes in food, land, water, energy and cities.",partners:"AgriAdapt acknowledges contributors: Clima y Cafe, National Agro Foundation, Tamil Nadu Agricultural University. Technical Advisory Committee: CIAT, Climate Edge, FAO GAEZ, IFPRI, IIASA, Olam, Suntory, World Bank and World Cocoa Foundation.",name:"AgriAdapt",types:["Risk assessment"],map:!0,mapUrl:"https://agriadapt.eu",website:"https://agriadapt.eu",desc:"Helps actors across agricultural value chains \u2014 funders, processors, distributors and government agencies \u2014 identify and understand the climate risks they face. Provides global, map-based and crop-specific data for rice, cotton and coffee. \u26A0\uFE0F Note: this site is no longer being updated and will be archived.",riskScope:"Water Risk,Drought Risk,Extreme weather Risk,Rainfall Risk",scenariosText:"Optimistic RCP4.5; Pessimistic RCP8.5",lastVersion:"2022",historisation:"First version in 2022. Updates incorporating user feedback.",frequency:"No fixed frequency identified.",locationScope:"World",coverage:"114 countries. 3 crops covered: rice, cotton and coffee.",indicators:"25",dataS:`Sources
FAO/IIASA, IFPRI/CGIAR-PIM/HarvestChoice, ECMWF, WRI/Vizzuality.

Scoring & Methodology
Co-designed with stakeholders across three pilot agricultural value chains (rice and cotton in India, coffee in Colombia). Used in 4 steps: select a crop, select a value chain node, identify associated climate risks, browse adaptation resources.`,extraction:"Dashboard version of maps and data to download from a location.",extractionLink:"https://agriadapt.eu",typeOfId:"No code identified.",exhOrg:"https://weefin.zendesk.com/hc/en-gb/articles/50552597803793-World-Resources-Institutee",exhDataset:"https://weefin.zendesk.com/hc/en-gb/articles/50552320011153-AgriAdapt"},{cat:"Physical Risk",org:"Climate Analytics",orgType:"Independent climate science and policy research institute based in Berlin, with regional offices across the Caribbean, South Asia, Australia, the Pacific, Africa and North America.",created:"Founded in 2008.",objectives:"Working on climate science, policy analysis and international climate negotiations with a focus on limiting warming to 1.5\xB0C, national climate targets, adaptation, climate finance and loss and damage. Developing tools such as the Climate Action Tracker, the Climate Impact Explorer and the 1.5\xB0C National Pathway Explorer.",partners:"Collaborates with governments, international organisations, NGOs and research initiatives. Partners and funders include Bloomberg Philanthropies, BMU, Caribbean Development Bank, CIFF, ClimateWorks Foundation, GIZ, EUKI, the European Commission, Global Methane Hub, GCF and IKEA Foundation. The Climate Vulnerability Monitor is funded by UNOPS and led by a consortium including Climate Analytics, GCA, Lancet Countdown, Finres, Global Data Lab, Mercator Research Institute and Climate Media Factory.",name:"Climate Vulnerability Monitor / Biophysical Data Explorer",types:["Risk assessment"],map:!0,mapUrl:"https://www.climate-analytics.org",website:"https://www.climate-analytics.org",desc:"Analyses current and future impacts of climate change on the environment, the economy and public health through 32 indicators. The Biophysical Data Explorer explores and visualises national-level climate impacts across temperature, water, wind and agriculture dimensions.",riskScope:"Extreme weather Risk,Water Risk,Drought Risk,Rainfall Risk",scenariosText:"SSP3-7.0; SSP1-2.6 + 1.5\xB0C reading based on near-term SSP1-2.6 impacts",lastVersion:"2022",historisation:"Launched in 2022 as part of the 3rd version of CVM.",frequency:"No fixed frequency identified.",locationScope:"World",coverage:"Global, with comparable national estimates for almost all countries and regions.",indicators:"19 biophysical indicators",dataS:`Sources
Mainly based on ISIMIP3 simulations, using impact models forced by CMIP6 climate models and bias-adjusted with historical observations. Complementary sources include SPEI drought calculations, crop yield models with CO2 fertilisation effects, and scientific attribution methods.

Scoring & Methodology
Interactive global map showing national-level biophysical indicators grouped by temperature, water, wind and agriculture. Results provided for 20-year averages across short-term, medium-term and long-term horizons.`,extraction:"Individual extraction from the interactive map by country, indicator and scenario in CSV.",extractionLink:"https://www.climate-analytics.org",typeOfId:"ISO Country Code",exhOrg:"https://weefin.zendesk.com/hc/en-gb/articles/50552808793233-Climate-Analytics",exhDataset:"https://weefin.zendesk.com/hc/en-gb/articles/50552759221009-Climate-Vulnerability-Monitor-Biophysical-Data-Explorer"},{cat:"Physical Risk",org:"Global Energy Monitor",orgType:"International NGO developing and analysing open data on energy infrastructure, resources and energy use. Headquartered in San Francisco. First operated as CoalSwarm before becoming Global Energy Monitor in 2018.",created:"Founded in 2007.",objectives:"Producing open data and analysis on global energy infrastructure including coal, oil, gas, renewables, steel and mining. Supporting transparency on energy transition risks, asset ownership and emissions.",partners:"Collaborates with Asset Resolution, Carbon Tracker Initiative, Ember, CREA, Earthjustice, E3G, IDDRI and LeadIT. Funded by Rockefeller Philanthropy Advisors, ClimateWorks Foundation and Climate Imperative Foundation.",name:"Global Coal Plant Tracker",types:["Asset tracker"],sectors:["Coal"],map:!0,mapUrl:"https://globalenergymonitor.org/projects/global-coal-plant-tracker/",website:"https://globalenergymonitor.org",desc:"Global dataset tracking coal-fired power generation units with a capacity of 30 MW or more. Tracks all operating units, all new units proposed since 2010, and all units retired since 2000.",riskScope:"Flood Risk,Water Risk",scenariosText:"",lastVersion:"July 2026",historisation:"Launched in 2014. Updated twice a year in January and July, with partial interim updates for new projects.",frequency:"Twice a year.",locationScope:"World",coverage:"14,509 coal power units in 108 countries, covering units of 30 MW and above.",indicators:"\u2014",dataS:`Sources
Built from government and regulatory data, company reports, media sources, local NGOs and field information. Each coal plant has a dedicated GEM.wiki page allowing sources to be traced at plant level.

Scoring & Methodology
GEM first compiles preliminary plant lists from public and private sources, then cross-checks using administrative data, company disclosures, press articles, NGO monitoring and local field contacts. Units are classified by project status: announced, pre-permit, permitted, construction, operating, mothballed, retired, shelved and cancelled.`,extraction:"Download available through an online form; data provided as Excel or CSV.",extractionLink:"https://globalenergymonitor.org/projects/global-coal-plant-tracker/",typeOfId:"Internal GEM codes",exhOrg:"https://weefin.zendesk.com/hc/en-gb/articles/50612316998801-Global-Energy-Monitor",exhDataset:"https://weefin.zendesk.com/hc/en-gb/articles/50612208317969-Global-Coal-Plant-Tracker"},{cat:"Physical Risk",org:"Open Supply Hub",orgType:"Non-profit organisation registered in the United States. Fully remote global team (17 members in 2026). Multi-stakeholder Board of Directors including representatives from civil society, trade unions, the open data sector, manufacturing groups, multi-stakeholder initiatives and companies.",created:"Launched in 2019 as the Open Apparel Registry. Open Supply Hub launched in November 2022.",objectives:"Mapping global supply chains across sectors. Standardising and cleaning supply chain data to make it open, reliable and usable. Supporting stakeholders in addressing human rights and environmental challenges. Improving visibility of production sites worldwide.",partners:"Funding from AWS, Draper Richards Kaplan Foundation, Heising-Simons Foundation, Humanity United and others. Technical steering committee includes Amazon, Northeastern University and Planet Tracker.",name:"Global supply chain data",types:["Asset tracker"],sectors:["Apparel","Automotive","Beauty","Consumer goods","Electronics","Energy & Utilities","Food & Beverages","Furniture","Sporting goods"],map:!0,mapUrl:"https://opensupplyhub.org",website:"https://opensupplyhub.org",desc:"Open data platform that transforms supply chain information into structured datasets. Originally focused on the apparel sector, it has since expanded across industries to map supply chains worldwide.",riskScope:"",scenariosText:"",lastVersion:"February 2026",historisation:"Launched in 2019 as the Open Apparel Registry. Expanded in 2022 into Open Supply Hub. Continuously enriched, latest data release in February 2026.",frequency:"Continuously enriched.",locationScope:"World",coverage:"2,514,946 production sites in 225 countries and territories. Sectors: Apparel, Automotive, Beauty, Consumer goods, Electronics, Energy & Utilities, Food & Beverages, Furniture and Sporting goods.",indicators:"\u2014",dataS:`Sources
Collaborative contribution model. Contributors include brands/retailers, service providers, multi-stakeholder initiatives, certification bodies, civil society organisations and factory/supplier groups.

Scoring & Methodology
All data uploaded are cleaned and deduplicated using a matching algorithm and assigned an industry-standard identifier. Open Supply Hub uses a priority order to determine which data is displayed first. The team actively moderates and highlights higher-quality data.`,extraction:"Download in CSV or Excel after registering via the link. Limited to 5,000 production sites per year.",extractionLink:"https://opensupplyhub.org",typeOfId:"ISO Country Code",exhOrg:"https://weefin.zendesk.com/hc/en-gb/articles/50613163254929-Open-Supply-Hub",exhDataset:"https://weefin.zendesk.com/hc/en-gb/articles/50612574859153-Open-Supply-Hub-Global-Supply-Chain-Data"},{cat:"Physical Risk",org:"Spatial Finance Initiative",orgType:"Research and data programme based at the University of Oxford, within the Oxford Sustainable Finance Group. Led by a multidisciplinary team specialising in sustainable finance, geospatial data, satellite observation and data science.",created:"Launched in 2019.",objectives:"Studying how geospatial data, satellite imagery and climate datasets can assess environmental risks for companies, assets and financial portfolios. Establishing open, asset-level databases for high-impact sectors. Conducting applied research to develop new methods for assessing risks, impacts and opportunities.",partners:"Developed with the Smith School of Enterprise and the Environment, the Alan Turing Institute and Satellite Applications Catapult. The Iron & Steel database is funded by the Children's Investment Fund Foundation.",name:"GeoAsset \u2013 Iron and Steel",types:["Asset tracker"],sectors:["Iron & Steel"],map:!0,mapUrl:"https://the-iea.github.io/cgfi-petro/",website:"https://spatialfinanceinitiative.com",desc:"Dataset mapping steel production assets worldwide. Provides detailed information on industrial facilities including their location, capacity and ownership.",riskScope:"",scenariosText:"",lastVersion:"2021",historisation:"First published in 2021. Progressively enriched since then with no public update calendar.",frequency:"No fixed frequency identified.",locationScope:"World",coverage:"Global coverage of iron and steel production assets, about 1,598 assets and up to 70% of global production (85\u201390% when combined with GEM data).",indicators:"\u2014",dataS:`Sources
Built from satellite imagery, existing databases, public and industry sources, and geospatial tools such as OpenStreetMap and Google Earth. Collects asset-level information: name, coordinates, country, owner, operational status, facility type, production capacity, production process, products and commissioning year.

Scoring & Methodology
Identifies iron and steel production assets through satellite imagery and geospatial analysis, then verifies and enriches using open and industry sources. Each asset is geolocated and documented with operational and ownership characteristics.`,extraction:"Direct download from the GeoAsset database page in Excel format.",extractionLink:"https://spatialfinanceinitiative.com",typeOfId:"Internal asset UID, ISO Country code",exhOrg:"https://weefin.zendesk.com/hc/en-gb/articles/50613433913489-Spatial-Finance-Initiative",exhDataset:"https://weefin.zendesk.com/hc/en-gb/articles/50613371052305-GeoAsset-Iron-Steel"},{cat:"Physical Risk",org:"UNEP / GRID-Geneva",orgType:"GRID-Geneva is part of the Early Warning and Assessment Division of UNEP's global GRID network. Composed of a team of 20 environment data scientists.",created:"Established by UNEP in 1985, operating since 1998.",objectives:"Transforming data into information and knowledge to support environmental decision-making. Processing satellite images, creating geospatial models and generating interactive maps. Providing capacity building and training on environmental issues.",partners:"Support from Swiss and local authorities formalised by a partnership agreement between UNEP, the Federal Office for the Environment and the University of Geneva (signed 1998, running until end of 2028). Supports UNDP, UNDRR and WMO. Member of the One Global Partnership network. The GIRI project was commissioned by the Coalition for Disaster Resilient Infrastructure (CDRI) with administrative support from UNDP.",name:"Global Infrastructure Risk Model & Resilience Index (GIRI)",types:["Risk assessment"],map:!0,mapUrl:"https://giri.unepgrid.ch",website:"https://giri.unepgrid.ch",desc:"Probabilistic model designed to identify and assess risks associated with geological and climate-related hazards across critical infrastructure sectors for all countries and territories worldwide. Provides globally comparable financial risk metrics including Average Annual Loss (AAL) and Probable Maximum Loss (PML).",riskScope:"Drought Risk,Flood Risk,Wind Risk,Earthquake Risk,Tsunami Risk,Subsidence Risk",scenariosText:"SSP1/RCP2.6; SSP5/RCP8.5",lastVersion:"2023",historisation:"Published in 2023. Currently in beta version with ongoing updates but no fixed release schedule.",frequency:"No fixed frequency identified.",locationScope:"World",coverage:"Global geographic coverage. Time horizon 2061\u20132100. 9 infrastructure sectors: energy and power, roads and railways, transportation, water and sanitation, telecommunications, oil and gas, education, healthcare and housing.",indicators:"100+",dataS:`Sources
Built using global open-source datasets including IBTrACS, OpenStreetMap and WMO data, complemented by proprietary sources such as MapX. Leverages hazard datasets (e.g. W5E5 and ISIMIP3b for flood risk) and builds on over 20 years of global risk modelling experience.

Scoring & Methodology
Combines stochastic hazard modelling, geolocated infrastructure exposure data and vulnerability functions covering 50+ infrastructure archetypes. Evaluates current and future climate conditions using SSPs/RCPs, generating probabilistic risk metrics such as loss exceedance curves and Average Annual Loss (AAL).`,extraction:"Download in CSV after filling fields via the link.",extractionLink:"https://giri.unepgrid.ch",typeOfId:"ISO Country code",exhOrg:"https://weefin.zendesk.com/hc/en-gb/articles/50613793432337-UNEP-GRID",exhDataset:"https://weefin.zendesk.com/hc/en-gb/articles/50613668598289-Global-Infrastructure-Risk-Model-and-Resilience-Index-GIRI"},{cat:"Physical Risk",org:"Global Facility for Disaster Reduction and Recovery (GFDRR)",orgType:"Multi-donor partnership administered by the World Bank, governed by a consultative group including the World Bank Group and UNDRR. Based in Washington D.C., working in more than 60 countries.",created:"Established in 2006.",objectives:"Strengthening risk-informed decision-making. Reducing risks and integrating disaster risk management. Improving financial preparedness. Enhancing disaster preparedness and resilient recovery. Providing a Knowledge Hub with online tools.",partners:"Think Hazard! developed and maintained by GFDRR Labs with BRGM, Camp to Camp, Deltares, World Bank Group and UR. v1 was used more than 140,000 times across 200 countries and integrated into the World Bank's operations portal.",name:"Think Hazard!",types:["Risk assessment"],map:!0,mapUrl:"https://www.thinkhazard.org/en/",website:"https://www.gfdrr.org",desc:"Provides an overview of the natural hazards affecting a given geographic area to strengthen resilience to disasters and climate shocks. Highlights the likelihood of various natural hazards (very low to high), provides guidance on how to reduce their impacts and recommends additional resources.",riskScope:"Wildfire Risk,Extreme weather Risk,Earthquake Risk,Wind Risk,Flood Risk,Sea-level rising Risk,Subsidence Risk,Volcanic Risk,Water Risk,Tsunami Risk",scenariosText:"Current hazards.",lastVersion:"2026",historisation:"First launched in 2016 covering 8 types of hazards. Version 2 in 2017 introduced methodological updates. Current version (2026) covers more hazards and is maintained as open source under GPL-3.0 on GitHub.",frequency:"No fixed frequency identified.",locationScope:"World",coverage:"Global, at district, province or country level (ADM2, ADM1 and ADM0). Does not provide risk levels for specific sites.",indicators:"\u2014",dataS:`Sources
Based on data from various private, academic and public organisations. Uses probabilistic or non-probabilistic data. When multiple datasets are available for a given hazard in a specific region, a decision tree is used to select one. Data sources listed on the recommendation page for each hazard.

Scoring & Methodology
Risk levels based on the probability that a region will be exposed to an event of sufficient intensity to cause damage. Hazards classified at ADM2 into 4 levels: High, Medium, Low and Very Low. ADM2 risk levels are then aggregated to ADM1 and ADM0 levels for a global and conservative view.`,extraction:"Download in PDF after mentioning a region via the link.",extractionLink:"https://www.thinkhazard.org",typeOfId:"No code identified.",exhOrg:"https://weefin.zendesk.com/hc/en-gb/articles/50713510463761-Global-Facility-for-Disaster-Reduction-and-Recovery-GFDRR",exhDataset:"https://weefin.zendesk.com/hc/en-gb/articles/50713452480529-ThinkHazard"},{cat:"Physical Risk",org:"Disaster Risk Management Knowledge Centre (DRMKC)",orgType:"Knowledge Centre hosted by the Joint Research Centre (JRC) of the European Commission. Promotes a network-based approach to the science-policy interface in disaster risk management.",created:"Launched in 2015.",objectives:"Strengthening the science\u2013policy interface in DRM across the European Commission, EU Member States and the wider DRM community. Fostering collaboration and connecting scientific communities. Facilitating exchange of information and knowledge while bridging science, operational activities and policy needs.",partners:"Partners include Health Emergency Preparedness and Response, Destination Earth, CERIS and International Partnership EW4All. Methodology peer-reviewed at EGU General Assembly 2021. Referenced by the UN as contributing to SDG 1 and SDG 13.",name:"DRMKC Risk Data Hub",types:["Risk assessment"],map:!0,mapUrl:"https://drmkc.jrc.ec.europa.eu/risk-data-hub",website:"https://drmkc.jrc.ec.europa.eu/risk-data-hub",desc:"Multi-hazard geo-portal designed to provide a common tool for scientists, practitioners and policymakers, fostering the connection between science and policy. The RDH ATLAS is a geospatial web platform to explore and visualise disaster risk-related information across Europe.",riskScope:"Earthquake Risk,Extreme weather Risk,Wind Risk,Flood Risk,Wildfire Risk,Subsidence Risk,Tsunami Risk",scenariosText:"Current hazards.",lastVersion:"December 2025",historisation:"First version in 2019 and update in 2020. Latest version in 2025.",frequency:"No fixed frequency identified.",locationScope:"Europe",coverage:"European geographic coverage. 16 exposures, 9 hazards and 1 vulnerability index.",indicators:"16 exposures & 1 vulnerability index",dataS:`Sources
Joint Research Centre (JRC), Global Dam Watch, UNESCO, Global Energy Monitor. Loss and damage data from PESETA IV (climate change impacts), NEWFRAME (local floods) and the HANZE database (TU Delft).

Scoring & Methodology
Disaster risk = Hazard \xD7 Exposure \xD7 Vulnerability. Key steps: data collection, extraction of geospatial information, disaggregation by NUTS regions, harmonisation of economic losses, aggregation by time and space, creation of RDH unique event identifiers at national and European level, calculation of average loss, and sharing via the RDH API.`,extraction:"Access to the data via API via the link.",extractionLink:"https://drmkc.jrc.ec.europa.eu/risk-data-hub",typeOfId:"ISO Country Code",exhOrg:"https://weefin.zendesk.com/hc/en-gb/articles/50731355898513-Disaster-Risk-Management-Knowledge-Centre-DRMKC",exhDataset:"https://weefin.zendesk.com/hc/en-gb/articles/50731209259537-DRMKC-Risk-Data-Hub-RDH"},{cat:"Physical Risk",org:"Bureau de recherches g\xE9ologiques et mini\xE8res (BRGM) \u2013 G\xE9orisques",orgType:"Web portal listing subsurface and surface risks in French territory. Developed in partnership between the Ministry of Ecological Transition and the French Geological Survey (BRGM). Around 1,100 people work at BRGM, including 800 engineers and researchers.",created:"BRGM created in 1959. G\xE9orisques launched in 2014.",objectives:"Understanding geological phenomena and associated risks. Developing new methodologies. Producing and disseminating data for soil, subsurface and resource management, risk and pollution prevention, and policies addressing climate change.",partners:"Partners listed: BRGM and Vigicrues. Traffic grew from 250 visits/day in 2014 to more than 18,000/day. Each day, visitors view over 90,000 pages and generate approximately 10,000 risk reports.",name:"G\xE9orisques \u2013 Conna\xEEtre les risques pr\xE8s de chez moi",types:["Risk assessment"],map:!0,mapUrl:"https://www.georisques.gouv.fr",website:"https://www.georisques.gouv.fr",desc:"Brings together cartographic information on various risks (flooding, ground movements, technological risks, earthquakes, wildfires and contaminated sites) previously distributed across around 30 different websites. Answers the question: 'What are the risks I am exposed to?'",riskScope:"Flood Risk,Earthquake Risk,Sea-level rising Risk,Subsidence Risk,Wind Risk,Drought Risk,Avalanche Risk,Volcanic Risk,Wildfire Risk",scenariosText:"Current hazards.",lastVersion:"Not mentioned.",historisation:"First version in 2014 and updated multiple times (no details provided on update frequency).",frequency:"No fixed frequency identified.",locationScope:"France",coverage:"Entire metropolitan French territory and, for certain risks, overseas departments. Level of detail down to address or cadastral parcel.",indicators:"\u2014",dataS:`Sources
Centralises information from more than 30 different databases: BRGM, local Departments, State and insurers within the National Observatory of Natural Risks. Data sources include: Historical Flood Database (BDHI), CASIAS, GISTRID, Onshore Wind Energy and Groundwater Flooding.

Scoring & Methodology
G\xE9orisques is an aggregator, not a data producer. Methodology distributed across various data sources. Risk levels (Unknown, No known risk, Not affected, Existing, Affected, Low, Moderate, High) provided for informational purposes only and may change over time as knowledge evolves.`,extraction:"Download in PDF after mentioning a location via the link. APIs enable data reuse by professionals.",extractionLink:"https://www.georisques.gouv.fr",typeOfId:"No code identified.",exhOrg:"https://weefin.zendesk.com/hc/en-gb/articles/50733828432657-Bureau-de-recherches-g\xE9ologiques-et-mini\xE8res-BRGM",exhDataset:"https://weefin.zendesk.com/hc/en-gb/articles/50733459858065-G\xE9orisques-Know-the-risks-near-me"},{cat:"Physical Risk",org:"Intergovernmental Panel on Climate Change (IPCC)",orgType:"United Nations intergovernmental scientific body responsible for assessing the state of knowledge on climate change. Brings together 195 member states.",created:"Created in 1988 by UNEP and the World Meteorological Organization.",objectives:"Assessing scientific literature on climate change including physical climate science, impacts, vulnerability, adaptation and mitigation. Providing the evidence base for governments and international climate policy.",partners:"International scientific collaboration between 195 member states, climate experts and observer organisations. Funded by WMO, UNEP, voluntary contributions from member states and the UNFCCC.",name:"IPCC WGI Interactive Atlas",types:["Risk assessment"],map:!0,mapUrl:"https://interactive-atlas.ipcc.ch",website:"https://interactive-atlas.ipcc.ch",desc:"Allows users to explore observed and projected climate change across regions, variables, scenarios and warming levels based on IPCC AR6 climate datasets.",riskScope:"Extreme weather Risk,Drought Risk,Wind Risk,Rainfall Risk,Sea-level rising Risk,Flood Risk",scenariosText:"Global Warming Levels (GWL): 1.5\xB0C, 2\xB0C, 3\xB0C and 4\xB0C",lastVersion:"September 2021",historisation:"Launched in September 2021. Fixed version linked to IPCC AR6, with no regular updates planned.",frequency:"No regular updates.",locationScope:"World",coverage:"Global across IPCC AR6 reference regions, including 46 land regions, 15 ocean regions and hybrid land-sea regions.",indicators:"22 variables and climate indices",dataS:`Sources
Mainly based on global and regional climate model outputs used in the IPCC AR6 assessment. Includes climate projections from CMIP5, CMIP6 and CORDEX covering 22 climate variables and indices.

Scoring & Methodology
Variables and climate indices first calculated from original model outputs on their native grids, then interpolated onto common regular grids (2\xB0 for CMIP5, 1\xB0 for CMIP6, 0.5\xB0 for CORDEX). Multi-model results aggregated by variable, scenario, time period and IPCC AR6 reference region.`,extraction:"Atlas online. Gridded data downloadable from IPCC Data Distribution Centre, Digital CSIC and Copernicus CDS in NetCDF4.",extractionLink:"https://interactive-atlas.ipcc.ch",typeOfId:"IPCC region acronyms, no external codes.",exhOrg:"https://weefin.zendesk.com/hc/en-gb/articles/50736921634193-GIEC-IPCC",exhDataset:"https://weefin.zendesk.com/hc/en-gb/articles/50736749280657-IPCC-WGI-Interactive-Atlas"},{cat:"Physical Risk",org:"Copernicus",orgType:"Earth-observation component of the EU's space programme. Coordinated and managed by the European Commission. Implementation distributed among the ESA, the JRC, the ECMWF and Mercator Ocean.",created:"Launched in 1998 when representatives of the European Commission, ESA, EUMETSAT and ESA signed the Baveno Manifesto.",objectives:"Supporting the EU's role as a global actor. Providing near real-time satellite data for atmosphere, marine environment, land surfaces, climate change, security and emergency management. Ensuring full, open and free access to data and information.",partners:"Implemented in partnership with Member States, ESA, EUMETSAT, ECMWF, EU agencies, Mercator Ocean, EEA and JRC. The Climate Data Store is operated by ECMWF on behalf of the EU.",name:"Climate Data Store \u2013 Global Bioclimatic Indicators",types:["Risk assessment"],map:!1,website:"https://cds.climate.copernicus.eu",desc:"Key infrastructure supporting the Copernicus Climate Change Service, providing climate variables, analyses, projections and indicators. The 'Global bioclimatic indicators from 1950 to 2100' dataset provides global bioclimatic indicators derived from CMIP5 climate projections describing how climate affects ecosystems, services and biodiversity.",riskScope:"Extreme weather Risk,Rainfall Risk,Drought Risk,Wind Risk,Subsidence Risk",scenariosText:"RCP4.5; RCP8.5",lastVersion:"2021",historisation:"First and last version in 2021.",frequency:"No fixed frequency identified.",locationScope:"World",coverage:"Global. Temporal range from 1950 to 2100. Temporal resolution: monthly, annual and 20-year averages.",indicators:"78",dataS:`Sources
Data from numerous sources such as VITO, BEF Estonia, DTU Aqua, Bioversity International and the Antwerp Zoo Society (KMDA). Selection of indicators based on user needs and stakeholder consultations.

Scoring & Methodology
78 indicators covering bioclimatic, drought, surface energy, vegetation-sensitive, evaporation, marine, essential climate variables, soil-related and wind indicators. Methodology: 1. Input dataset selection, 2. Bias correction, 3. Indicator calculation, 4. Downscaling, 5. Delta change correction.`,extraction:"Downloading NetCDF content requires prior registration.",extractionLink:"https://cds.climate.copernicus.eu",typeOfId:"No code identified.",exhOrg:"https://weefin.zendesk.com/hc/en-gb/articles/50737847000081-Copernicus",exhDataset:"https://weefin.zendesk.com/hc/en-gb/articles/50737662302609-Climate-Data-Store-Global-Bioclimatic-Indicators"},{cat:"Physical Risk",org:"Copernicus",orgType:"Earth-observation component of the EU's space programme. Coordinated and managed by the European Commission.",created:"Launched in 1998.",objectives:"Bringing together existing fire information at regional and national levels to provide a global overview and assessment of fire regimes and their impacts.",partners:"Joint initiative of GEO and the Copernicus work programmes. Builds on EFFIS, GTOS, GOFC Fire IT, the Copernicus Emergency Management Service (JRC), the Copernicus Atmosphere Monitoring Service and the Global Fire Assimilation System (ECMWF), along with Terra and Aqua satellites (NASA) and VIIRS.",name:"Global Wildfire Information System (GWIS)",types:["Risk assessment"],map:!0,mapUrl:"https://gwis.jrc.ec.europa.eu",website:"https://gwis.jrc.ec.europa.eu",desc:"Joint initiative of GEO and Copernicus that brings together existing sources of fire information. The GWIS country profiles provide a concise overview of fire trends, seasonality and spatial distribution, plus burned areas, by country and at sub-national level for all countries worldwide.",riskScope:"Wildfire Risk",scenariosText:"Current hazards.",lastVersion:"April 2024",historisation:"Version of the data in 2017. Latest in 2024.",frequency:"No fixed frequency identified.",locationScope:"World",coverage:"Global at national and sub-national levels (200+ countries). Historical data from 2002 to 2024.",indicators:"\u2014",dataS:`Sources
Builds on EFFIS, GTOS, GOFC Fire IT, the Copernicus Emergency Management Service and Copernicus Atmosphere Monitoring Service, GFAS (ECMWF), Terra and Aqua satellites (NASA) and VIIRS.

Scoring & Methodology
Includes number of fires, burned areas, vegetation/land cover damage, seasonality, fire frequency and emissions. Statistics on average burned areas and number of fires (2002\u20132024) at regional and sub-national levels; extent of burned areas and seasonality; impacts on land cover and monthly biomass burning emissions.`,extraction:"Downloading directly in CSV via the link.",extractionLink:"https://gwis.jrc.ec.europa.eu",typeOfId:"ISO Country Code, GADM",exhOrg:"https://weefin.zendesk.com/hc/en-gb/articles/50737847000081-Copernicus",exhDataset:"https://weefin.zendesk.com/hc/en-gb/articles/50737752515473-Global-Wildfire-Information-System"},{cat:"Physical Risk",org:"ETH Zurich \u2013 Weather and Climate Risks",orgType:"Joint chair between ETH Zurich and MeteoSwiss, part of the Institute for Environmental Decisions (IED), Department of Environmental Systems Science (D-USYS). 14 people work on the CLIMADA tool.",created:"The Weather and Climate Risks Chair was established in 2016.",objectives:"Fundamental research on climate and risk. Developing and applying CLIMADA to study impacts of natural hazards. Analysing how climate information is integrated into decision-making. Collaborating with stakeholders to co-produce climate services. Modelling climate risks using the Economics of Climate Adaptation (ECA) approach.",partners:"CLIMADA is at the core of the Weather4UN project with IFRC and WMO. Member of ISIMIP. Used by Frankfurt School of Finance, UNU, NGFS and EIOPA (which has developed its own CLIMADA app).",name:"CLIMADA",types:["Platform"],map:!1,website:"https://climada.ethz.ch/climada/",desc:"Free and open-source software for climate risk assessment and analysis of adaptation options. Fully probabilistic, it allows users to combine exposure, hazard and vulnerability data to compute risk. Users can generate probabilistic impact data, analyse effects of climate change and assess adaptation measures.",riskScope:"Flood Risk,Earthquake Risk,Wind Risk,Wildfire Risk,Hail Risk,Extreme weather Risk,Drought Risk",scenariosText:"RCP2.6; RCP4.5; RCP6.0; RCP8.5",lastVersion:"September 2025",historisation:"ECA methodology originally developed in 2009. First official version v1 in 2019. v1.4.1 in 2021, v2 in 2022, v3 & v4 in 2023, v5 in 2024. Latest stable version in September 2025.",frequency:"No fixed frequency identified.",locationScope:"World",coverage:"Global (250+ territories). Projected times: 2030, 2050, 2080, 2100.",indicators:"\u2014",dataS:`Sources
Aggregator and modelling engine connecting public sources including ISIMIP, IBTrACS, STORM and CHAZ, and transforming them into usable risk metrics.

Scoring & Methodology
Provides a perspective on physical risk aligned with TCFD and the ECA approach. Follows the IPCC risk framework: models hazard intensity (using historical event sets or stochastic simulations), overlays spatial exposure data and applies vulnerability functions to estimate damage. Aggregates results to compute expected impacts such as economic losses or affected populations.`,extraction:"Via the Python API (install CLIMADA and query programmatically) or the web API portal. LitPop data (asset exposure) also available for direct download on the ETH Research Repository and Humanitarian Data Exchange (HDX) in CSV format.",extractionLink:"https://climada.ethz.ch/climada/",typeOfId:"ISO Country Code",exhOrg:"https://weefin.zendesk.com/hc/en-gb/articles/50738131846161-ETH-Zurich-Weather-and-Climate-Risks",exhDataset:"https://weefin.zendesk.com/hc/fr/articles/50738064623505-CLIMADA-CLIMate-ADAptation"},{cat:"Physical Risk",org:"Ocean Risk and Resilience Action Alliance (ORRAA)",orgType:"International multi-stakeholder alliance bringing together financial institutions, insurers, governments, multilateral organisations, NGOs and civil society actors focused on ocean risk, coastal resilience and sustainable blue finance.",created:"Launched in 2019 at the UN Secretary-General's Climate Action Summit.",objectives:"Developing financial and insurance solutions to strengthen coastal resilience, protect marine ecosystems and mobilise investment towards a sustainable blue economy. Working on ocean and coastal risks, resilience of coastal communities, financing of nature-based solutions and development of finance and insurance tools.",partners:"Founding members include AXA, Bank of America, UNDP, Inter-American Development Bank, WTW, The Nature Conservancy, Rare, Ocean Unite and the Global Resilience Partnership.",name:"The Coastal Risk Index (CRI)",types:["Risk assessment"],map:!0,mapUrl:"https://oceanriskalliance.org",website:"https://oceanriskalliance.org",desc:"Assesses present and future coastal flood risk and estimates how ecosystems such as mangroves and coral reefs reduce exposure for people and assets.",riskScope:"Sea-level rising Risk,Flood Risk",scenariosText:"Current hazards.",lastVersion:"2023",historisation:"One version available since 2023.",frequency:"No fixed frequency identified.",locationScope:"World",coverage:"179 coastal countries. Projected times: 2030 and 2050.",indicators:"\u2014",dataS:`Sources
Combines hydrodynamic models, social and economic vulnerability data, global elevation data, present and future extreme sea-level data, flood protection data and coastal ecosystem layers (mangroves and coral reefs).

Scoring & Methodology
Models coastal flooding using globally consistent sea-level forcing and a reduced-physics flood model. Integrates high-resolution elevation data and compares conditions with and without natural protective ecosystems. Impacts estimated by combining flood depth with population, GDP and damage functions.`,extraction:"Mainly online consultation via the map. Data download only by invitation.",extractionLink:"https://oceanriskalliance.org",typeOfId:"No code identified.",exhOrg:"https://weefin.zendesk.com/hc/en-gb/articles/50734223072785-Ocean-Risk-and-Resilience-Action-Alliance-ORRAA",exhDataset:"https://weefin.zendesk.com/hc/en-gb/articles/50734081123857-The-Coastal-Risk-Index-CRI"},{cat:"Physical Risk",org:"UN Environment Programme (UNEP)",orgType:"Environmental authority of the United Nations system. Based in Nairobi, works with 193 Member States and regional offices worldwide to coordinate global environmental action.",created:"Created in 1972 following the United Nations Conference on the Human Environment in Stockholm.",objectives:"Working across climate change, biodiversity, pollution, ecosystems, environmental governance and sustainable development. Producing assessments, supporting policy implementation and coordinating environmental action within the UN system.",partners:"Works with member states, UN agencies, multilateral development banks, financial institutions, NGOs, private actors and scientific partners. Funding mainly from voluntary state contributions, project-specific funds and the Environment Fund.",name:"Freshwater Ecosystems Explorer",types:["Risk assessment"],map:!0,mapUrl:"https://www.sdg661.app",website:"https://www.sdg661.app",desc:"Tracks changes in freshwater ecosystems worldwide, including surface water, wetlands, rivers, lakes, reservoirs and mangroves, to support SDG 6.6.1 reporting.",riskScope:"Water Risk,Habitat Loss Risk,Mangrove deforestation risk",scenariosText:"Current hazards.",lastVersion:"11 June 2025",historisation:"SDG 6.6.1 monitoring launched in 2015, pilot data collection in 2017, platform online in 2020, latest official metadata update on 11 June 2025.",frequency:"Annual satellite data updates.",locationScope:"World",coverage:"Global geographic coverage: national, administrative and basin level.",indicators:"\u2014",dataS:`Sources

ale in 2024. Last version launched on 3 April 2025.",frequency:"No fixed frequency identified.",locationScope:"World",coverage:"Global geographic coverage with multiscale analysis from subnational areas to global level.",indicators:"\u2014",dataS:`Sources

,lastVersion:"2021",historisation:"Original scientific publication dated 2016. Last version in 2021.",frequency:"No fixed frequency identified.",locationScope:"World",coverage:"All land surfaces worldwide at 30m \xD7 30m. Covers natural water bodies (rivers, lakes, coastal areas, wetlands) and artificial ones (reservoirs, mines, rice fields, hydraulic infrastructure). Historical time series: 1984\u20132021.",indicators:"\u2014",dataS:`Sources

d by AI.",frequency:"No fixed frequency identified.",locationScope:"World",coverage:"Global across countries, political divisions, continental basins, major rivers, tributaries, watersheds and sub-watersheds. Historical time series from 1980 to near real time; forecasts up to 12 months in advance.",indicators:"\u2014",dataS:`Sources

d by funds managing more than USD 13 trillion in assets. The technical team consists of staff from GRID-Arendal, the University of Sydney and Catapult Satellite Applications, with support from academics and industry professionals.",name:"Global Tailings Storage Facilities",types:["Asset tracker"],sectors:["Mining"],map:!0,mapUrl:"https://tailing.grida.no/map/maps/",website:"https://tailing.grida.no",desc:"Searchable database containing detailed information on more than 1,800 mine tailings dams worldwide. Compiles information disclosed by mining companies about their tailings storage facilities and allows users to sort data by location, company, dam type, height, volume and risk level.",riskScope:"",scenariosText:"",lastVersion:"2020",historisation:"First and last version in January 2020.",frequency:"No fixed frequency identified.",locationScope:"World",coverage:"109 mining companies, 312 mine operators, 782 mining sites, 1,950 tailings storage facilities.",indicators:"\u2014",dataS:`Sources

rs:["Steel"],map:!0,mapUrl:"https://www.industrytransition.org/green-steel-tracker/",website:"https://www.industrytransition.org/green-steel-tracker/",desc:"Centralises all information on low-carbon investments in the steel industry. Monitors the progress of initiatives using technologies capable of minimising CO2 emissions. Pursues 2 core objectives: to classify low-carbon project announcements in the primary steel sector and to display climate pledges of leading steel manufacturers with short-term targets to 2030 and long-term targets to 2050.",riskScope:"",scenariosText:"",lastVersion:"February 2026",historisation:"First version in December 2021. General updates at least once every six months. Latest update in February 2026.",frequency:"Twice a year.",locationScope:"World",coverage:"Low-carbon projects in primary steel achieving an 85% reduction (below 300 kg CO2 per tonne of steel). 158 projects researched, 62 qualified projects and 170 companies referenced.",indicators:"\u2014",dataS:`Sources

s under IPCC- and NGFS-aligned scenarios in 2030 and 2050.",riskScope:"Extreme weather Risk",scenariosText:"SSP5: high climate impact; SSP2: business as usual; SSP1: net-zero aligned",lastVersion:"2023",historisation:"Launched in 2018. 2023: third and latest version.",frequency:"No fixed frequency identified.",locationScope:"World",coverage:"40 of the biggest (listed) meat and dairy companies. 4 cost drivers: feed, carbon tax, heat stress, feed additives. 2 time horizons: 2030 and 2050.",indicators:"\u2014",dataS:`Sources

 and analysis.",name:"ResilienceArc",types:["Risk assessment"],map:!1,website:"https://www.arc.finance",desc:"Open, free tool that helps assess companies' exposure to physical risks from climate change and supports more resilient business decisions. Brings together asset-level climate risk data, corporate disclosures on adaptation measures and a unified, expert-built assessment of resilience in a single open and transparent framework.",riskScope:"Sea-level rising Risk,Extreme Heat Risk,Wind Risk,Wildfire Risk,Landslides Risk,Flood Risk,Subsidence Risk,Tropical Cyclones Risk,Freeze-thaw Risk",scenariosText:"RCP2.6; RCP4.5; RCP6.0 (default); RCP8.5",lastVersion:"July 2026",historisation:"Launched as a prototype in November 2025 at COP30. Officially launched in beta on 22 June 2026 during London Climate Action Week.",frequency:"No fixed frequency identified.",locationScope:"World",coverage:"~200 companies with full resilience assessments across all five metrics. ~2,750 companies covered with physical risk profiles. Sectors: auto, cement, diversified mining, electricity, food agriculture, oil & gas, paper, steel, transport & other.",indicators:"200+ indicators across 5 metrics",dataS:`Sources
Asset-level physical risk data provided by XDI. Company disclosures analysed via AI-based review of public reports. Complementary data provided by Corporate Knights.

Scoring & Methodology
ResilienceArc comprises 2 core components:
1) Physical risk exposure \u2014 XDI asset-based risk models integrating IPCC AR6 climate scenarios, assessing vulnerability to 11 hazards up to 2100 under four RCP scenarios.
2) Corporate risk management \u2014 LSE EarthCap's C-RAB methodology evaluates how companies manage material physical climate risks across four metrics: Processes, Implementation, Governance and Targets. Aligns with ISSB IFRS S1/S2, TCFD, TNFD, ACT Adaptation, CDP Climate Change Questionnaire and EU CSRD ESRS E1.

Scoring & Methodology
'Scape risk' is a value (scale of 1\u20135) that assesses a specific aspect of biodiversity at a given site for a given industrial activity. 58 indicators compiled to calculate 15 risk categories, aggregated into 3 risk types (physical, regulatory deficiency and reputational). Users must input: site location, WWF RFS Industry Sector Classification and site importance (high/medium/low).`,extraction:"In the Assess module, download risk values for all sites in Excel via the Portfolio Manager. Average risk values at country and province level available in the Country Profiles page of the Explore module (no registration required).",extractionLink:"https://riskfilter.org",typeOfId:"ISO Country code, Sub-country ID, Site ID",exhOrg:"https://weefin.zendesk.com/hc/en-gb/articles/50748131152529-WWF",exhDataset:"https://weefin.zendesk.com/hc/en-gb/articles/50748075873425-WWF-Biodiversity-Risk"},{cat:"Biodiversity Risk",org:"The International Union for Conservation of Nature (IUCN)",orgType:"Membership Union composed of both government and civil society organisations based in Switzerland. More than 1,500 Member organisations from over 160 countries and input from some 19,000 experts.",created:"Created in 1948.",objectives:"Acting as a trusted policy and scientific advisor. Supporting implementation of the 2030 Agenda, SDGs and biodiversity-related conventions. Supporting direct conservation action through grants. Building capacity of professionals and students. Generating and publishing evidence-based research to advance nature conservation.",partners:"Framework partners providing core funding: governments of Denmark, Finland, France, Republic of Korea, Luxembourg, Norway, Sweden and Switzerland. Multilateral partners include the European Commission, GCF and GEF. IUCN holds a formally accredited permanent observer mission to the UN. The IUCN Red List is an official indicator for UN SDG Goal 15 and the CBD's Kunming-Montreal Global Biodiversity Framework.",name:"IUCN Red List",types:["Risk assessment"],map:!0,mapUrl:"https://www.iucnredlist.org",website:"https://www.iucnredlist.org",desc:"Indicator of the health of the world's biodiversity. A tool to inform and catalyse action for biodiversity conservation and policy change. Provides information about range, population size, habitat and ecology, use and trade, threats and conservation actions.",riskScope:"Biodiversity risk",scenariosText:"",lastVersion:"July 2026",historisation:"Founded in 1964 (initially covering only mammals and birds). 16th version in March 2024 marked the 60th anniversary with 166,000+ species. Next publication will be in November 2026.",frequency:"At least twice a year.",locationScope:"World",coverage:"Global. Over 172,600 species assessed globally, of which approximately 48,600 (28%) are threatened with extinction. Taxonomic scope: Animals, plants and fungi. Includes subspecies, varieties (plants only) and subpopulations.",indicators:"\u2014",dataS:`Sources
Major species assessors include BirdLife International, the Institute of Zoology (ZSL), the World Conservation Monitoring Centre and many IUCN Species Survival Commission Specialist Groups (SSC). The Red List is made possible through 13 Red List Partner organisations.

Scoring & Methodology
Assessments carried out in a peer-reviewed manner through IUCN SSC Specialist Groups, which are Red List Authorities (RLA). IUCN aims to have every species re-evaluated at least every ten years (every five years if possible). Species evaluated against quantitative criteria based on biological factors related to extinction risk: population size, rate of decline, geographic range and extinction probability.`,extraction:"Spatial data available in 3 formats: polygons in Esri shapefile, points as CSV and Freshwater HydroBASIN Tables in CSV. Fill in the form so your download request can be processed.",extractionLink:"https://www.iucnredlist.org",typeOfId:"ISO Country code, kingdom, phylum, class, order, family, genus and species",exhOrg:"https://weefin.zendesk.com/hc/en-gb/articles/50748458916753-The-International-Union-for-Conservation-of-Nature-IUCN",exhDataset:"https://weefin.zendesk.com/hc/en-gb/articles/50748429304593-IUCN-Red-List"},{cat:"Biodiversity Risk",org:"Global Mangrove Alliance",orgType:"Partnership between WWF and The Nature Conservancy promoting a coordinated, multidisciplinary approach to mangrove conservation and restoration. Headquartered in Washington, bringing together government, academia, non-profit organisations and the private sector.",created:"Launched in 2018 at the World Ocean Summit.",objectives:"Halting deforestation: reduce net mangrove loss due to direct human activities to zero. Restoring half: replant mangroves to cover at least half of the recently lost area. Double protecting: ensure long-term protection is strengthened, increasing from 40% to 80% of remaining mangroves.",partners:"More than 100 members including the Blue Climate Initiative and Conservation International. The Global Mangrove Watch maps are used by UNEP to establish sustainable development reports.",name:"Global Mangrove Watch \u2013 Mangrove Deforestation Alerts",types:["Risk assessment"],map:!0,mapUrl:"https://www.globalmangrovewatch.org",website:"https://www.globalmangrovewatch.org",desc:"Online platform providing remote sensing data and tools to monitor mangroves. Offers near-real-time information on the location and nature of changes affecting mangroves worldwide. The 'Mangrove Deforestation Alerts' dataset is visualised as a heatmap showing locations where there is a high level of confidence regarding mangrove deforestation.",riskScope:"Habitat Loss Risk,Mangrove deforestation risk",scenariosText:"",lastVersion:"2025",historisation:"First version of the portal in 2020. First data for the Mangrove Deforestation Alerts also published in 2020. The 2025 version is the 4th version.",frequency:"Monthly (Mangrove Deforestation Alerts).",locationScope:"World",coverage:"Global at national, sub-national and local levels. 535 areas monitored. Covers January 2019 to February 2026, updated monthly.",indicators:"24 widgets (Mangrove Deforestation Alerts being one)",dataS:`Sources
For the Mangrove Deforestation Alerts: Sentinel-2 satellites and Normalised Difference Vegetation Index (NDVI).

Scoring & Methodology
The alert system relies on optimised NDVI thresholds to detect mangrove loss, combined with a temporal scoring approach to reduce false positives. Estimated overall accuracy of 92.1%, with commission and omission error rates of 10.4% and 20.6% respectively.`,extraction:"Data available for download in GeoPackage (GPKG) and Excel (XLSX) formats via the Global Mangrove Watch platform and its associated data repository on Zenodo.",extractionLink:"https://www.globalmangrovewatch.org",typeOfId:"ISO Country Code",exhOrg:"https://weefin.zendesk.com/hc/en-gb/articles/50749490854929-Global-Mangrove-Alliance",exhDataset:"https://weefin.zendesk.com/hc/en-gb/articles/50749469863697-Global-Mangrove-Watch"},{cat:"Biodiversity Risk",org:"Yale Center for Biodiversity and Global Change",orgType:"Research centre dedicated to advancing the understanding and conservation of biodiversity, based at Yale University in New Haven, USA.",created:"Launched in 2018.",objectives:"Studying the Earth's biodiversity. Generating knowledge and tools to support its conservation.",partners:"Collaborates with the Global Biodiversity Alliance, NASA, the Convention on Biological Diversity, Google Earth Engine and others.",name:"Map of Life \u2013 Species Protection Index (SPI)",types:["Risk assessment"],map:!0,mapUrl:"https://mol.org",website:"https://mol.org",desc:"Map of Life is a web platform supporting effective biodiversity education, monitoring, research and decision-making by assembling knowledge about species distributions and their dynamics. The Species Protection Index (SPI) assesses how well protected areas and OECMs effectively protect species' habitats and support their long-term survival.",riskScope:"Habitat Loss Risk",scenariosText:"",lastVersion:"2026",historisation:"First calculation of the SPI in 2021, updated every year. Major update in 2025 with higher coverage.",frequency:"Annual.",locationScope:"World",coverage:"Global. 450,000+ species: Amphibians (7,376), Birds (10,389), Ants (13,834), Butterflies and Moths (19,204), Mammals (6,413), Dragonflies and Damselflies (6,269), Plants (373,974), Reptiles (10,804).",indicators:"\u2014",dataS:`Sources
SPI combines species distribution data from the IUCN Red List, GBIF and eBird, supplemented by scientific studies, local biodiversity inventories, regional modelling initiatives and protected-area datasets from the World Database on Protected Areas (WDPA). Infrastructure supported by WWF, the Field Museum, NASA, Google Earth Engine, Esri and GEO BON.

Scoring & Methodology
SPI measures how well species are represented within protected areas by comparing the proportion of each species' range under protection against a species-specific conservation target based on geographic range size. Country-level SPI scores calculated as a weighted average, with greater weight assigned to endemic species, resulting in an index ranging from 0 to 100.`,extraction:"Mainly online consultation via the dashboard link.",extractionLink:"https://mol.org",typeOfId:"\u2014",exhOrg:"https://weefin.zendesk.com/hc/en-gb/articles/50748893315089-Yale-Center-for-Biodiversity-and-Global-Change",exhDataset:"https://weefin.zendesk.com/hc/en-gb/articles/50748844507281-Map-of-Life"},{cat:"Biodiversity Risk",org:"ProtectedSeas",orgType:"Nonprofit marine conservation organisation affiliated with the Anthropocene Institute. Team of 15 employees based in California.",created:"Founded in 2015.",objectives:"Developing the Navigator (catalogues marine protected areas and levels of protection, provides information on illegal fishing and measures progress toward the 30x30 target). Developing the Marine Monitor M2 (software solution for real-time awareness of coastal marine environments).",partners:"Allied organisations include Deckee, Law of the Wild, Dalhousie University, Ecopa, Biopama, COBI, ESRI, CMSF and Garmin.",name:"ProtectedSeas Navigator",types:["Risk assessment"],map:!0,mapUrl:"https://navigatormap.org",website:"https://navigatormap.org",desc:"Free, interactive map providing information on the regulations applied to nearly 30,000 marine areas (coastal and saltwater) worldwide. Provides analysis of legal protections, indicates where illegal fishing is taking place and measures progress toward the 30x30 target.",riskScope:"Habitat Loss Risk",scenariosText:"",lastVersion:"2023",historisation:"Project first started in 2015 and required 8 years before providing the first and last version in 2023. Regular updates on the dataset.",frequency:"No fixed frequency identified.",locationScope:"World",coverage:"35,000 marine areas observed, 24,000 areas with some form of legal protection, 20,000 matched boundaries and 2,400 digitised boundaries, 22,000 marine areas listed.",indicators:"\u2014",dataS:`Sources
Publicly accessible documents, websites, digital maps and contact with management authorities to request additional information.

Scoring & Methodology
1. Different marine areas collected. 2. A lawyer specialised in ocean regulation reviews and summarises the regulations, types of protection and legal instruments for each area. 3. Types of fishing gear and human activities classified as permitted, restricted or prohibited. 4. Boundary data examined and associated with managed zones. 5. When digital boundaries are unavailable, they are digitised from the legal description. 6. For each area, a fishing protection score from 1 to 5 is assigned using a decision tree.`,extraction:"Download on demand as a CSV file, GeoJSON file or Esri file.",extractionLink:"https://navigatormap.org",typeOfId:"No code identified.",exhOrg:"https://weefin.zendesk.com/hc/en-gb/articles/50749271131921-ProtectedSeas",exhDataset:"https://weefin.zendesk.com/hc/en-gb/articles/50749059487249-ProtectedSeas-Navigator"},{cat:"Biodiversity Risk",org:"UN Biodiversity Lab (UNBL)",orgType:"International digital platform developed within the United Nations framework. Free and open-source, enabling non-commercial users to access more than 400 global data layers on nature, climate change and sustainable development. Team of 20+ experts from UNDP, UNEP and UNEP-WCMC.",created:"Launched in 2018 with Version 1. Relaunched in 2021 as UNBL 2.0.",objectives:"Providing access to global spatial data to improve stakeholders' understanding and promote positive impacts in line with the Global Biodiversity Framework. Democratising access to spatial data and biodiversity analysis tools as a global public good. Helping decision-makers leverage spatial data to better understand challenges and define priorities.",partners:"Created by UNDP, UNEP and the Convention on Biological Diversity. Technical partners include Microsoft, NASA and the UNCCC. Accredited as a digital public good by the Digital Public Good Alliance. Data providers include Allen Coral Atlas, Anthroecology Lab, BirdLife International, CBCS, CIFOR, EOX, ESA and the European Commission.",name:"Biodiversity Habitat Index",types:["Risk assessment"],map:!0,mapUrl:"https://www.unbiodiversitylab.org",website:"https://www.unbiodiversitylab.org",desc:"The CSIRO Biodiversity Habitat Index (BHI) estimates the level of species diversity that should be maintained within any given spatial unit, based on the area of that unit, its connectivity and the integrity of the natural ecosystems that compose it. Used to track and report on past and current trends in the expected persistence of species diversity.",riskScope:"Habitat Loss Risk",scenariosText:"",lastVersion:"2026",historisation:"First publication in 2020. 4th version in 2026.",frequency:"No fixed frequency identified.",locationScope:"World",coverage:"Global (excluding Antarctica). Species: 400,000 species of terrestrial vascular plants, vertebrates and invertebrates. Covered period: 2000\u20132024 (files for 2000, 2005, 2010, 2015 and 2020).",indicators:"\u2014",dataS:`Sources
Data provided by the Commonwealth Scientific and Industrial Research Organisation (CSIRO), derived from spatial datasets on species composition, ecosystem condition, connectivity, climate scenarios and protected areas.
